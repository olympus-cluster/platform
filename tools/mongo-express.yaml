# mongo-express - web UI for MongoDB at http://mongo.localtest.me
# Login: MONGO_EXPRESS_USER / MONGO_EXPRESS_PASSWORD from .env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongo-express }
  template:
    metadata:
      labels: { app: mongo-express }
    spec:
      containers:
        - name: mongo-express
          image: mongo-express:1.0.2-20-alpine3.19
          ports:
            - containerPort: 8081
          env:
            - name: ME_CONFIG_MONGODB_URL
              valueFrom: { secretKeyRef: { name: mongo-express, key: url } }
            - name: ME_CONFIG_BASICAUTH
              value: "true"
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom: { secretKeyRef: { name: mongo-express, key: username } }
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-express, key: password } }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: 8081 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
spec:
  selector: { app: mongo-express }
  ports:
    - port: 80
      targetPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mongo-express
spec:
  rules:
    - host: mongo.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: mongo-express, port: { number: 80 } }
