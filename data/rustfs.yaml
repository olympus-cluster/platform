# RustFS - S3-compatible object storage (MinIO-style) for files: audio, images, uploads.
#
# Inside the cluster (S3 API):  http://rustfs.data.svc:9000   path-style, region us-east-1
# Web console:                  http://s3.localtest.me -> /rustfs/console/  (login: S3_ACCESS_KEY / S3_SECRET_KEY from .env)
# Apps create their own buckets at startup.
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
    - name: console
      port: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        fsGroup: 10001          # the image runs as uid 10001; make the volume writable for it
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.3
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ADDRESS
              value: 0.0.0.0:9001
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: rustfs, key: access-key } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: rustfs, key: secret-key } }
          resources:
            # 8 concurrent player-like streams pushed it past 512Mi (OOMKilled in QA), so give it headroom.
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1536Mi }
          readinessProbe:
            httpGet: { path: /health, port: s3 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: s3 }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-console
  annotations:
    # Traefik middleware below, referenced as <namespace>-<name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: data-rustfs-console-root@kubernetescrd
spec:
  rules:
    - host: s3.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: rustfs, port: { name: console } }
---
# Traefik Middleware: send "/" to the console's real path.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rustfs-console-root
spec:
  redirectRegex:
    regex: ^(https?://[^/]+)/?$
    replacement: ${1}/rustfs/console/
